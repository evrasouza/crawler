name: Non-Production Environment Scan

on:
  workflow_dispatch:
    inputs:
      brands:
        description: 'Brands to scan. Use "all" or comma-separated IDs, e.g. can-am,sea-doo'
        required: true
        default: 'all'

      max_pages:
        description: 'Maximum number of pages per brand'
        required: true
        default: '10000'

      concurrency:
        description: 'Concurrent pages per brand'
        required: true
        default: '5'

      fail_on_findings:
        description: 'Fail brand job when non-production URLs are found'
        required: true
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare brand matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build brand matrix
        id: matrix
        env:
          SELECTED_BRANDS: ${{ inputs.brands }}
        run: |
          python <<'PY'
          import json
          import os

          with open("config/brands.json", encoding="utf-8") as file:
              config = json.load(file)

          brands = config["brands"]
          selected = os.environ.get("SELECTED_BRANDS", "all").strip()

          if selected.lower() != "all":
              requested = {
                  brand.strip()
                  for brand in selected.split(",")
                  if brand.strip()
              }

              brands = [
                  brand
                  for brand in brands
                  if brand["id"] in requested
              ]

              found = {brand["id"] for brand in brands}
              missing = requested - found

              if missing:
                  raise SystemExit(
                      "Unknown brand(s): " +
                      ", ".join(sorted(missing))
                  )

          if not brands:
              raise SystemExit("No brands selected.")

          matrix = json.dumps(
              {"brand": brands},
              separators=(",", ":")
          )

          print("Matrix:")
          print(json.dumps({"brand": brands}, indent=2))

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"matrix={matrix}\n")
          PY

  scan:
    name: Scan ${{ matrix.brand.name }}
    needs:
      - prepare

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Scan ${{ matrix.brand.name }}
        id: scan
        continue-on-error: true
        env:
          SCAN_NAME: ${{ matrix.brand.id }}
          MAX_PAGES: ${{ inputs.max_pages }}
          CONCURRENCY: ${{ inputs.concurrency }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        run: |
          npm run scan -- "${{ matrix.brand.url }}"

      - name: Add result to GitHub summary
        if: always()
        env:
          BRAND_NAME: ${{ matrix.brand.name }}
          BRAND_ID: ${{ matrix.brand.id }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const brandId = process.env.BRAND_ID;
          const brandName = process.env.BRAND_NAME;
          const path = `output/${brandId}/latest.json`;

          if (!fs.existsSync(path)) {
            console.log(`Report not found: ${path}`);
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const summary = report.summary;
          const findings = report.findings || [];
          const failedPages = report.failedPageDetails || [];

          const findingResult =
            summary.totalFindings > 0
              ? `❌ ${summary.totalFindings} non-production finding(s) detected`
              : '✅ No non-production findings';

          const crawlStatus =
            summary.failedPages > 0
              ? `⚠️ ${summary.failedPages} page(s) could not be fully scanned`
              : '✅ No crawl failures';

          const completionStatus = summary.scanCompleted ? '✅ Complete' : '⚠️ Incomplete';
          const limitStatus = summary.scanLimitReached ? '⚠️ Yes' : 'No';

          let markdown = `
          # ${brandName}

          **Non-production result:** ${findingResult}

          **Crawl status:** ${crawlStatus}

          ## Scan Overview

          | Metric | Result |
          |---|---:|
          | Pages scanned | ${summary.pagesScanned.toLocaleString()} |
          | Links checked | ${summary.linksChecked.toLocaleString()} |
          | Failed pages | ${summary.failedPages.toLocaleString()} |
          | Direct non-prod links | ${summary.directNonProdLinks.toLocaleString()} |
          | Redirects to non-prod | ${summary.redirectsToNonProd.toLocaleString()} |
          | Total findings | ${summary.totalFindings.toLocaleString()} |
          | Affected pages | ${summary.matchingPages.toLocaleString()} |
          | Scan completed | ${completionStatus} |
          | Scan limit reached | ${limitStatus} |

          `;

          if (summary.scanLimitReached) {
            markdown += `
          > ⚠️ **Scan limit reached.**
          >
          > The crawler stopped after ${summary.pagesScanned.toLocaleString()} pages.
          > Additional findings may exist beyond the configured scan limit.

          `;
          }

          if (failedPages.length > 0) {
            const MAX_FAILED_PAGES = 25;
            const visibleFailedPages = failedPages.slice(0, MAX_FAILED_PAGES);

            markdown += `
          ## ⚠️ Crawl warnings / failed pages

          These are navigation or processing failures. They are **not automatically considered non-production findings**.

          | # | Page | Reason | Error |
          |---:|---|---|---|
          `;

            for (const failure of visibleFailedPages) {
              const reason = String(failure.reason || 'UNKNOWN').replace(/\|/g, '\\|');
              const error = String(failure.error || '(no error details)')
                .replace(/\|/g, '\\|')
                .replace(/\n/g, ' ')
                .slice(0, 140);

              markdown +=
                `| ${failure.id} ` +
                `| [Open page](${failure.url}) ` +
                `| ${reason} ` +
                `| ${error} |\n`;
            }

            if (failedPages.length > MAX_FAILED_PAGES) {
              markdown += `

          Showing the first **${MAX_FAILED_PAGES}** of **${failedPages.length}** failed pages.

          `;
            }
          }

          if (findings.length > 0) {
            const MAX_SUMMARY_FINDINGS = 25;
            const visibleFindings = findings.slice(0, MAX_SUMMARY_FINDINGS);

            markdown += `
          ## 🚨 Non-production URLs found

          | # | Type | Source page | Link text | Incorrect target |
          |---:|---|---|---|---|
          `;

            for (const finding of visibleFindings) {
              const type =
                finding.type === 'DIRECT_NON_PROD_LINK'
                  ? '🔴 Direct link'
                  : '🟠 Redirect';

              const linkText = String(finding.linkText || '(no text)')
                .replace(/\|/g, '\\|')
                .replace(/\n/g, ' ')
                .slice(0, 80);

              const sourceUrl = finding.sourcePage;
              const targetUrl =
                finding.type === 'DIRECT_NON_PROD_LINK'
                  ? finding.originalUrl
                  : finding.finalUrl;

              markdown +=
                `| ${finding.id} ` +
                `| ${type} ` +
                `| [View source](${sourceUrl}) ` +
                `| ${linkText} ` +
                `| [Open incorrect URL](${targetUrl}) |\n`;
            }

            if (findings.length > MAX_SUMMARY_FINDINGS) {
              markdown += `

          Showing the first **${MAX_SUMMARY_FINDINGS}** of **${findings.length}** findings.

          `;
            }
          }

          markdown += `
          ## Full reports

          Download the workflow artifact:

          **\`non-prod-report-${brandId}\`**

          It contains:

          - \`latest.json\` — complete latest scan
          - \`non-prod-scan-*.json\` — historical complete scan
          - \`findings.json\` — non-production findings only
          - \`findings-by-page.json\` — findings grouped by source page
          - \`failed-pages.json\` — pages that could not be fully scanned

          ---
          Job summary generated at run-time.
          `;

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          NODE

      - name: Upload ${{ matrix.brand.name }} report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: non-prod-report-${{ matrix.brand.id }}
          path: output/${{ matrix.brand.id }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job when strict mode finds issues
        if: |
          inputs.fail_on_findings &&
          steps.scan.outcome == 'failure'
        run: |
          echo "Non-production environment findings detected."
          exit 1
